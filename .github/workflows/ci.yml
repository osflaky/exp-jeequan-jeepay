name: CI

on:
  workflow_dispatch:

jobs:
  maven-compile:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          java: 17
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest-17-arm64
    name: Maven 编译 [${{ matrix.expander_leg }}]
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: ${{ (matrix.os == 'windows-latest' && matrix.arch == 
          'arm64') && 'zulu' || 'temurin' }}
        java-version: '${{ matrix.java }}'
        cache: maven
    - name: Compile（skip tests）
      run: mvn -B -DskipTests -T 1C clean compile
    - name: Compile tests
      run: mvn -B -DskipTests -T 1C test-compile
    timeout-minutes: 150
