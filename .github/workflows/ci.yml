name: CI

on:
  workflow_dispatch:

jobs:
  maven-compile:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          java: 17
          arch: x64
          runner: windows-latest
        - os: windows-latest
          java: 17
          arch: arm64
          runner: windows-11-arm
        - os: macos-latest
          java: 17
          arch: x64
          runner: macos-15-intel
    name: Maven 编译
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '${{ matrix.java }}'
        cache: maven
    - name: Compile（skip tests）
      run: mvn -B -DskipTests -T 1C clean compile
    - name: Compile tests
      run: mvn -B -DskipTests -T 1C test-compile
